name: Fetch translation runtime

on:
  push:
    paths:
      - '.github/workflows/fetch-translation-runtime.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download QuickMT English-Chinese CTranslate2 model
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf runtime
          mkdir -p runtime/model runtime/wheels
          base='https://huggingface.co/quickmt/quickmt-en-zh/resolve/main'
          for f in config.json model.bin source_vocabulary.json target_vocabulary.json src.spm.model tgt.spm.model eole-config.yaml; do
            curl -L --fail --retry 5 "$base/$f?download=true" -o "runtime/model/$f"
          done
          python -m pip download --only-binary=:all: --no-deps \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --abi cp313 \
            ctranslate2==4.8.1 \
            --dest runtime/wheels
          sha256sum runtime/model/* runtime/wheels/* || true
          du -sh runtime

      - name: Upload translation runtime
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: translation-runtime-quickmt
          path: runtime
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Publish artifact metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          cat > runtime-artifact.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "artifact_id": "${{ steps.upload.outputs.artifact-id }}",
            "artifact_url": "${{ steps.upload.outputs.artifact-url }}",
            "artifact_name": "translation-runtime-quickmt",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime-artifact.json
          git commit -m 'Publish QuickMT translation runtime artifact metadata' || true
          git push
